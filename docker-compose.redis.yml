services:
  redis:
    image: redis:latest
    hostname: redis
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
  # Only the metrics package's cluster spec uses this, which skips when REDIS_CLUSTER_NODES is
  # unset, so the service is optional for everything else. Three masters in one container:
  # gossip stays inside the container's network namespace while the host reaches each node
  # through its published port, which is what makes the announced 127.0.0.1 correct for both.
  redis-cluster:
    image: redis:7
    hostname: redis-cluster
    restart: unless-stopped
    ports:
      - 7101:7101
      - 7102:7102
      - 7103:7103
    command:
      - bash
      - -c
      - |
        for port in 7101 7102 7103; do
          redis-server --port $$port --cluster-enabled yes \
            --cluster-config-file /tmp/nodes-$$port.conf --cluster-node-timeout 5000 \
            --appendonly no --save '' \
            --cluster-announce-ip 127.0.0.1 --cluster-announce-port $$port \
            --cluster-announce-bus-port 1$$port --daemonize yes
        done
        sleep 2
        redis-cli --cluster create 127.0.0.1:7101 127.0.0.1:7102 127.0.0.1:7103 \
          --cluster-replicas 0 --cluster-yes
        exec tail -f /dev/null
  # The postgres image is only borrowed for its openssl binary, which the redis images lack.
  redis-cluster-tls-certs:
    image: postgres:17
    volumes:
      - ./.redis-cluster-tls:/tls
    entrypoint:
      - bash
      - -c
      - |
        set -e
        cd /tls
        [ -f redis.crt ] && exit 0
        openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -subj /CN=bull-board-test-ca \
          -keyout ca.key -out ca.crt
        openssl req -newkey rsa:2048 -nodes -subj /CN=localhost -keyout redis.key -out redis.csr
        openssl x509 -req -in redis.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 3650 \
          -extfile <(echo subjectAltName=DNS:localhost) -out redis.crt
        chmod 644 ca.crt redis.crt redis.key
  redis-cluster-tls:
    image: redis:7
    hostname: redis-cluster-tls
    restart: unless-stopped
    depends_on:
      redis-cluster-tls-certs:
        condition: service_completed_successfully
    volumes:
      - ./.redis-cluster-tls:/tls:ro
    ports:
      - 7201:7201
      - 7202:7202
      - 7203:7203
    command:
      - bash
      - -c
      - |
        for port in 7201 7202 7203; do
          redis-server --port 0 --tls-port $$port --tls-cluster yes --tls-auth-clients no \
            --tls-cert-file /tls/redis.crt --tls-key-file /tls/redis.key \
            --tls-ca-cert-file /tls/ca.crt --cluster-enabled yes \
            --cluster-config-file /tmp/nodes-$$port.conf --cluster-node-timeout 5000 \
            --appendonly no --save '' \
            --cluster-announce-hostname localhost --cluster-preferred-endpoint-type hostname \
            --daemonize yes
        done
        sleep 2
        redis-cli --tls --cacert /tls/ca.crt --cluster create \
          127.0.0.1:7201 127.0.0.1:7202 127.0.0.1:7203 --cluster-replicas 0 --cluster-yes
        exec tail -f /dev/null
  # Only the BullMQ v6 half of the version matrix uses this, to cover the PostgreSQL backend.
  # Those tests skip when POSTGRES_URL is unset, so the service is optional for everything else.
  postgres:
    image: postgres:17
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: bullmq
      POSTGRES_USER: bullmq
      POSTGRES_DB: bullmq
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  redis_data:
  postgres_data:
