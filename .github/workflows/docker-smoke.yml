name: Docker smoke build

on:
  push:
    branches:
      - master
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker*.yml
  pull_request:
    branches:
      - master
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker*.yml

jobs:
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for every published platform
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: bull-board:ci

      - name: Run the CLI from the image
        run: docker run --rm bull-board:ci --version
